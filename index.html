<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps Gambi</title>
<meta name="description" content="Télécharger Halo, PowerMac, Agentique et Vitrine pour macOS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;750&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3ef; --carte: #ffffff; --texte: #18181b; --doux: #6b6b73;
    --bord: #e4e2dc; --accent: #2b59ff; --accent-texte: #fff; --ok: #1f9d55;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f12; --carte: #17181c; --texte: #f2f2f3; --doux: #9a9aa3;
      --bord: #26272d; --accent: #5b7cff; --accent-texte: #fff; --ok: #3ccf7f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f12; --carte: #17181c; --texte: #f2f2f3; --doux: #9a9aa3;
    --bord: #26272d; --accent: #5b7cff; --accent-texte: #fff; --ok: #3ccf7f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texte);
    font: 16px/1.45 Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px 40px; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 30px; font-weight: 750; letter-spacing: -0.02em; margin: 0 0 6px; }
  header p { color: var(--doux); margin: 0; }
  .liste { display: grid; gap: 12px; }
  .app {
    display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
    background: var(--carte); border: 1px solid var(--bord); border-radius: 18px; padding: 14px;
  }
  .app img { width: 64px; height: 64px; border-radius: 14px; }
  .app h2 { font-size: 17px; font-weight: 650; margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .version { font-size: 12px; color: var(--doux); font-variant-numeric: tabular-nums; font-weight: 500; }
  .app p { margin: 2px 0 0; font-size: 14px; color: var(--doux); }
  .bouton {
    display: inline-block; text-decoration: none; white-space: nowrap;
    background: var(--accent); color: var(--accent-texte); font-weight: 600; font-size: 14px;
    padding: 9px 16px; border-radius: 999px;
  }
  .bouton[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .vedette { border: 1.5px solid var(--accent); }
  .etiquette { font-size: 11px; font-weight: 650; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .note { margin-top: 28px; font-size: 13px; color: var(--doux); text-align: center; }
  .note b { color: var(--texte); font-weight: 600; }
  @media (max-width: 420px) {
    .app { grid-template-columns: 52px 1fr; }
    .app img { width: 52px; height: 52px; border-radius: 12px; }
    .app .bouton { grid-column: 1 / -1; text-align: center; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Apps Gambi</h1>
    <p>Des apps macOS natives, mises à jour toutes seules.</p>
  </header>

  <div class="liste" id="liste"></div>

  <p class="note">
    Le plus simple : <b>installe Vitrine</b>, elle pose les trois apps et te dit quand une version sort.
    Ensuite chaque app se met à jour d'elle-même (Sparkle).<br>
    macOS 14 ou plus récent.
  </p>
</main>

<script>
  // Chaque app : son dépôt public *-Share porte l'appcast Sparkle et les zips.
  const APPS = [
    { nom: "Vitrine", share: "Vitrine-Share", icone: "vitrine.png", vedette: true,
      texte: "Installe et garde à jour les trois apps ci-dessous." },
    { nom: "Halo", share: "halo-Share", icone: "halo.png",
      texte: "Ton agent IA : conversations par projet, terminaux, tâches planifiées." },
    { nom: "PowerMac", share: "PowerMac-Share", icone: "powermac.png",
      texte: "La suite de ton Mac, logée dans l'encoche." },
    { nom: "Agentique", share: "AGENTIQUE-Share", icone: "agentique.png",
      texte: "Le terminal pensé pour travailler avec des agents IA." },
  ];

  const liste = document.getElementById("liste");
  for (const app of APPS) {
    const el = document.createElement("article");
    el.className = "app" + (app.vedette ? " vedette" : "");
    // Lien de repli : le zip « sans version » joint à la dernière release.
    const repli = `https://github.com/gambidrissi-dev/${app.share}/releases/latest/download/${app.nom}.zip`;
    el.innerHTML = `
      <img src="${app.icone}" alt="" onerror="this.style.visibility='hidden'">
      <div>
        ${app.vedette ? '<div class="etiquette">Commence ici</div>' : ""}
        <h2>${app.nom} <span class="version"></span></h2>
        <p>${app.texte}</p>
      </div>
      <a class="bouton" href="${repli}">Télécharger</a>`;
    liste.appendChild(el);
    majDepuisAppcast(app, el);
  }

  // La version et le lien exacts viennent de l'appcast : la page ne ment
  // jamais sur ce qui est en ligne, sans qu'on la republie à chaque version.
  async function majDepuisAppcast(app, el) {
    try {
      const rep = await fetch(`https://raw.githubusercontent.com/gambidrissi-dev/${app.share}/main/appcast.xml?t=${Date.now()}`);
      if (!rep.ok) throw new Error(rep.status);
      const xml = new DOMParser().parseFromString(await rep.text(), "application/xml");
      const SP = "http://www.andymatuschak.org/xml-namespaces/sparkle";
      let meilleur = null;
      for (const item of xml.querySelectorAll("item")) {
        const enc = item.querySelector("enclosure");
        if (!enc) continue;
        const build = parseInt(item.getElementsByTagNameNS(SP, "version")[0]?.textContent
                               ?? enc.getAttributeNS(SP, "version") ?? "0", 10);
        const version = item.getElementsByTagNameNS(SP, "shortVersionString")[0]?.textContent
                        ?? enc.getAttributeNS(SP, "shortVersionString") ?? "";
        if (!meilleur || build > meilleur.build) meilleur = { build, version, url: enc.getAttribute("url") };
      }
      if (!meilleur) return;
      el.querySelector(".version").textContent = meilleur.version;
      el.querySelector(".bouton").href = meilleur.url;
    } catch {
      el.querySelector(".version").textContent = "";
    }
  }
</script>
</body>
</html>
